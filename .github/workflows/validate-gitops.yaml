name: Validate GitOps upgrades

on:
  pull_request:
  push:
    branches:
      - main
      - "chore/**"
      - "renovate/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-gitops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Render and server-side validate
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && 'homelab-homelab-apps' || 'ubuntu-latest' }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15.2"

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: Set up kubectl for Kustomize rendering
        run: |
          version=v1.37.0
          base="https://dl.k8s.io/release/$version/bin/linux/amd64"
          curl -fsSL --retry 3 "$base/kubectl" -o "$RUNNER_TEMP/kubectl"
          curl -fsSL --retry 3 "$base/kubectl.sha256" -o "$RUNNER_TEMP/kubectl.sha256"
          printf '%s  %s\n' "$(cat "$RUNNER_TEMP/kubectl.sha256")" "$RUNNER_TEMP/kubectl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/kubectl"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install validator dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Lint GitHub Actions workflows
        run: |
          curl -fsSLO \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          curl -fsSLO \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt
          sha256sum --check --ignore-missing actionlint_1.7.12_checksums.txt
          tar -xzf actionlint_1.7.12_linux_amd64.tar.gz actionlint
          ./actionlint -color

      - name: Fetch bootstrap CRDs
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm --force-update
          helm repo add traefik https://traefik.github.io/charts --force-update
          helm repo update argo traefik
          helm template argo-cd argo/argo-cd \
            --version 10.18.0 \
            --namespace argocd \
            --include-crds \
            --set crds.install=true > /tmp/argo-cd-crds.yaml
          helm template traefik-crds traefik/traefik-crds \
            --version 1.18.0 \
            --namespace kube-system > /tmp/traefik-crds.yaml

      - name: Render every Helm release and Kustomization
        run: |
          python scripts/validate_gitops.py \
            --output .validation-renders \
            --extra-crds-yaml /tmp/argo-cd-crds.yaml \
            --extra-crds-yaml /tmp/traefik-crds.yaml

      - name: Verify rendered images resolve
        run: |
          curl -fsSLO \
            https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          curl -fsSLO \
            https://github.com/google/go-containerregistry/releases/download/v0.22.1/checksums.txt
          sha256sum --check --ignore-missing checksums.txt
          tar -xzf go-containerregistry_Linux_x86_64.tar.gz crane
          ./crane version
          python scripts/validate_images.py \
            .validation-renders/images.txt \
            --crane ./crane

      - name: Server-side dry-run all candidates
        run: bash scripts/dry-run-gitops.sh .validation-renders

      - name: Upload rendered candidates
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitops-validation-renders
          path: .validation-renders/
          if-no-files-found: ignore
          retention-days: 7
