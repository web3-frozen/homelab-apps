# Reusable CI/CD pipeline for containerized microservices
# Designed to scale to 100+ services with zero per-repo boilerplate.
#
# Features:
#   - Multi-language support (Go, Node.js, Python, etc.)
#   - Docker build + push to GHCR with immutable SHA tags
#   - Trivy vulnerability scanning (fail on CRITICAL/HIGH)
#   - SBOM generation (SPDX via Syft)
#   - Automatic image tag update in homelab-apps for GitOps
#   - Signed container images (cosign keyless)
#
# Usage (caller workflow):
#   jobs:
#     ci:
#       uses: web3-frozen/homelab-apps/.github/workflows/ci-container.yaml@main
#       with:
#         app-name: demo-api
#         workload-dir: workloads/demo-app
#         image-name: demo-api
#       secrets: inherit
#
name: CI Container Pipeline

on:
  workflow_call:
    inputs:
      app-name:
        description: "Application name (used for labeling)"
        required: true
        type: string
      image-name:
        description: "Container image name (ghcr.io/web3-frozen/<image-name>)"
        required: true
        type: string
      workload-dir:
        description: "Path in homelab-apps repo for Kustomize image update"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      build-context:
        description: "Docker build context"
        required: false
        type: string
        default: "."
      # Language-specific steps
      go-version:
        description: "Go version (set to enable Go lint/test)"
        required: false
        type: string
      node-version:
        description: "Node.js version (set to enable Node lint/test)"
        required: false
        type: string
      trivy-severity:
        description: "Trivy severity threshold"
        required: false
        type: string
        default: "CRITICAL,HIGH"
      trivy-exit-code:
        description: "Trivy exit code on findings (0=warn, 1=fail)"
        required: false
        type: string
        default: "1"
      rebuild_reason:
        description: "Why this image is being rebuilt (set by CVE remediation)"
        required: false
        type: string
        default: ""
      cve_ids:
        description: "Comma-separated baseline CVE IDs"
        required: false
        type: string
        default: ""
      previous_image:
        description: "Previously deployed image digest/reference"
        required: false
        type: string
        default: ""
      baseline_run_id:
        description: "CVE remediation workflow run containing the baseline artifact"
        required: false
        type: string
        default: ""
      application:
        description: "Argo CD Application to verify after merge"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}
  GITOPS_REPO: web3-frozen/homelab-apps

jobs:
  # ── Lint & Test ──────────────────────────────────────────────
  lint-test:
    name: Lint & Test
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('homelab-{0}', github.event.repository.name) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Go
      - name: Setup Go
        if: inputs.go-version != ''
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Go lint
        if: inputs.go-version != ''
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          # Runner pods are capped at 1 CPU / 2Gi. On a cold module+build cache
          # (go.sum change invalidates the setup-go cache key) golangci-lint
          # exceeded that limit and the runner pod died mid-step, surfacing as
          # "The self-hosted runner lost communication with the server".
          # GOMEMLIMIT makes the Go runtime GC harder instead of growing past
          # the container limit; GOGC is the fallback for older toolchains.
          GOMEMLIMIT: "2600MiB"
        with:
          version: v2.15.0  # pinned: v2 default linters incl. errcheck; 'latest' caused surprise CI breaks
          # 25m: cold-cache lint on a 1-2 CPU runner needs >15m for this repo
          # (see demo-api PR #13: exit code 4 = timeout at 15m, every job)
          args: --timeout=25m

      - name: Go test
        if: inputs.go-version != ''
        run: go test -race ./...

      - name: Go coverage
        if: inputs.go-version != ''
        run: |
          go test -coverprofile=coverage.out ./... || true
          go tool cover -func=coverage.out

      # Node.js
      - name: Setup Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Node install
        if: inputs.node-version != ''
        run: npm ci

      - name: Node lint
        if: inputs.node-version != ''
        run: npm run lint

      - name: Node test
        if: inputs.node-version != ''
        run: npm test -- --run

  # ── Build & Push Container ──────────────────────────────────
  build-push:
    name: Build & Push
    needs: lint-test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ format('homelab-{0}', github.event.repository.name) }}
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.sha-tag.outputs.tag }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute SHA tag
        id: sha-tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Connect Buildx to the runner's BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: remote
          endpoint: tcp://127.0.0.1:1234

      - name: Configure GHCR authentication
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.docker"
          auth=$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          jq -n --arg auth "$auth" '{auths:{"ghcr.io":{auth:$auth}}}' > "$HOME/.docker/config.json"
          chmod 600 "$HOME/.docker/config.json"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          pull: true
          no-cache: ${{ inputs.baseline_run_id != '' }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ── Security Scan ───────────────────────────────────────────
  security:
    name: Security Scan
    needs: build-push
    runs-on: ${{ format('homelab-{0}', github.event.repository.name) }}
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GHCR authentication
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.docker"
          auth=$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          jq -n --arg auth "$auth" '{auths:{"ghcr.io":{auth:$auth}}}' > "$HOME/.docker/config.json"
          chmod 600 "$HOME/.docker/config.json"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE }}@${{ needs.build-push.outputs.image-digest }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: ${{ inputs.trivy-severity }}
          exit-code: ${{ inputs.trivy-exit-code }}
          version: "v0.76.2"
          limit-severities-for-sarif: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"

      - name: Generate SBOM
        uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: "${{ env.IMAGE }}@${{ needs.build-push.outputs.image-digest }}"
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ inputs.app-name }}
          path: sbom.spdx.json
          retention-days: 90

  # ── Deploy (update image tag in GitOps repo) ────────────────
  deploy:
    name: Update GitOps
    needs: [build-push, security]
    if: github.ref == 'refs/heads/main' && needs.build-push.result == 'success' && needs.security.result == 'success'
    runs-on: ${{ format('homelab-{0}', github.event.repository.name) }}
    permissions:
      contents: read
    steps:
      - name: Check GITOPS_TOKEN
        id: check-token
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::GITOPS_TOKEN is required to open the GitOps deployment PR"
            exit 1
          fi
        env:
          TOKEN: ${{ secrets.GITOPS_TOKEN }}

      - name: Checkout homelab-apps
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: web3-frozen/homelab-apps
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0

      - name: Pin tested image digest
        run: |
          cd ${{ inputs.workload-dir }}
          kustomize edit set image ${{ env.IMAGE }}=${{ env.IMAGE }}@${{ needs.build-push.outputs.image-digest }}

      - name: Push deployment branch
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          APP_NAME: ${{ inputs.app-name }}
          IMAGE_TAG: ${{ needs.build-push.outputs.image-tag }}
          IMAGE_DIGEST: ${{ needs.build-push.outputs.image-digest }}
          REBUILD_REASON: ${{ inputs.rebuild_reason }}
          CVE_IDS: ${{ inputs.cve_ids }}
          PREVIOUS_IMAGE: ${{ inputs.previous_image }}
          BASELINE_RUN_ID: ${{ inputs.baseline_run_id }}
          APPLICATION: ${{ inputs.application }}
          WORKLOAD_DIR: ${{ inputs.workload-dir }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="deploy/${APP_NAME}-${IMAGE_TAG}-${RUN_ID}"
          git checkout -b "$branch"
          git add .
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          marker_token=""
          if [ -n "$BASELINE_RUN_ID" ] && [ -n "$CVE_IDS" ]; then
            marker_token=$(python3 - <<'PY'
          import base64
          import json
          import os
          import zlib

          image = os.environ["IMAGE"]
          repository = image.split("@", 1)[0]
          last = repository.rsplit("/", 1)[-1]
          if ":" in last:
              repository = repository.rsplit(":", 1)[0]
          application = os.environ.get("APPLICATION", "").strip()
          if not application:
              application = os.path.basename(os.environ.get("WORKLOAD_DIR", "").rstrip("/"))
          marker = {
              "version": 1,
              "kind": "private-image",
              "source_run": {
                  "repo": os.environ["GITOPS_REPO"],
                  "run_id": int(os.environ["BASELINE_RUN_ID"]),
                  "artifact": "cve-scan",
              },
              "applications": [application] if application else [],
              "repositories": [repository],
              "image": f"{image}@{os.environ['IMAGE_DIGEST']}",
              "previous_image": os.environ.get("PREVIOUS_IMAGE", ""),
              "cve_ids": sorted(filter(None, os.environ.get("CVE_IDS", "").split(","))),
              "changes": [{
                  "kind": "digest-pin",
                  "file": f"{os.environ.get('WORKLOAD_DIR', '').rstrip('/')}/kustomization.yaml",
                  "image": repository,
                  "digest": os.environ["IMAGE_DIGEST"],
              }],
          }
          raw = json.dumps(marker, sort_keys=True, separators=(",", ":")).encode()
          print(base64.urlsafe_b64encode(zlib.compress(raw, 9)).decode().rstrip("="))
          PY
          )
          fi

          commit_title="deploy(${APP_NAME}): pin ${IMAGE_TAG} digest"
          if [ -n "$marker_token" ]; then
            commit_title="deploy(${APP_NAME}): CVE rebuild ${IMAGE_TAG}"
            git commit -m "$commit_title" -m "CVE-Remediation: ${marker_token}"
          else
            git commit -m "$commit_title"
          fi

          body="Automated image update from ${GITHUB_REPOSITORY}@${GITHUB_SHA}.

          Image: \`${IMAGE}@${IMAGE_DIGEST}\`${REBUILD_REASON:+

          Rebuild reason: ${REBUILD_REASON}}

          Triggered by ${{ github.repository }}@${{ github.sha }}"
          if [ -n "$marker_token" ]; then
            body="${body}

          <!-- cve-remediation:v1:${marker_token} -->"
          fi

          git push -u origin "$branch"

          gh pr create \
            --repo "$GITOPS_REPO" \
            --base main \
            --head "$branch" \
            --title "deploy(${APP_NAME}): ${IMAGE_TAG}" \
            --body "$body"

          gh pr merge \
            --repo "$GITOPS_REPO" \
            "$branch" \
            --squash \
            --auto \
            --delete-branch
