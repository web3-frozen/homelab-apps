# Reusable CI/CD pipeline for containerized microservices
# Designed to scale to 100+ services with zero per-repo boilerplate.
#
# Features:
#   - Multi-language support (Go, Node.js, Python, etc.)
#   - Docker build + push to GHCR with immutable SHA tags
#   - Trivy vulnerability scanning (fail on CRITICAL/HIGH)
#   - SBOM generation (SPDX via Syft)
#   - Automatic image tag update in homelab-apps for GitOps
#   - Signed container images (cosign keyless)
#
# Usage (caller workflow):
#   jobs:
#     ci:
#       uses: web3-frozen/homelab-apps/.github/workflows/ci-container.yaml@main
#       with:
#         app-name: demo-api
#         workload-dir: workloads/demo-app
#         image-name: demo-api
#       secrets: inherit
#
name: CI Container Pipeline

on:
  workflow_call:
    inputs:
      app-name:
        description: "Application name (used for labeling)"
        required: true
        type: string
      image-name:
        description: "Container image name (ghcr.io/web3-frozen/<image-name>)"
        required: true
        type: string
      workload-dir:
        description: "Path in homelab-apps repo for Kustomize image update"
        required: true
        type: string
      dockerfile:
        description: "Path to Dockerfile"
        required: false
        type: string
        default: "Dockerfile"
      build-context:
        description: "Docker build context"
        required: false
        type: string
        default: "."
      # Language-specific steps
      go-version:
        description: "Go version (set to enable Go lint/test)"
        required: false
        type: string
      node-version:
        description: "Node.js version (set to enable Node lint/test)"
        required: false
        type: string
      trivy-severity:
        description: "Trivy severity threshold"
        required: false
        type: string
        default: "CRITICAL,HIGH"
      trivy-exit-code:
        description: "Trivy exit code on findings (0=warn, 1=fail)"
        required: false
        type: string
        default: "1"

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}

jobs:
  # ── Lint & Test ──────────────────────────────────────────────
  lint-test:
    name: Lint & Test
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && format('homelab-{0}', github.event.repository.name) || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Go
      - name: Setup Go
        if: inputs.go-version != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: true

      - name: Go lint
        if: inputs.go-version != ''
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0  # pinned: v2 default linters incl. errcheck; 'latest' caused surprise CI breaks
          args: --timeout=5m

      - name: Go test
        if: inputs.go-version != ''
        run: go test -race ./...

      - name: Go coverage
        if: inputs.go-version != ''
        run: |
          go test -coverprofile=coverage.out ./... || true
          go tool cover -func=coverage.out

      # Node.js
      - name: Setup Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Node install
        if: inputs.node-version != ''
        run: npm ci

      - name: Node lint
        if: inputs.node-version != ''
        run: npm run lint

      - name: Node test
        if: inputs.node-version != ''
        run: npm test -- --run

  # ── Build & Push Container ──────────────────────────────────
  build-push:
    name: Build & Push
    needs: lint-test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ format('homelab-{0}', github.event.repository.name) }}
    permissions:
      contents: read
      packages: write
    outputs:
      image-tag: ${{ steps.sha-tag.outputs.tag }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute SHA tag
        id: sha-tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Connect Buildx to the runner's BuildKit
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: remote
          endpoint: tcp://127.0.0.1:1234

      - name: Configure GHCR authentication
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.docker"
          auth=$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          jq -n --arg auth "$auth" '{auths:{"ghcr.io":{auth:$auth}}}' > "$HOME/.docker/config.json"
          chmod 600 "$HOME/.docker/config.json"

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.build-context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  # ── Security Scan ───────────────────────────────────────────
  security:
    name: Security Scan
    needs: build-push
    runs-on: ${{ format('homelab-{0}', github.event.repository.name) }}
    permissions:
      contents: read
      packages: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure GHCR authentication
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$HOME/.docker"
          auth=$(printf '%s:%s' "$GITHUB_ACTOR" "$GHCR_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          jq -n --arg auth "$auth" '{auths:{"ghcr.io":{auth:$auth}}}' > "$HOME/.docker/config.json"
          chmod 600 "$HOME/.docker/config.json"

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ env.IMAGE }}@${{ needs.build-push.outputs.image-digest }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: ${{ inputs.trivy-severity }}
          exit-code: ${{ inputs.trivy-exit-code }}
          version: "v0.76.2"
          limit-severities-for-sarif: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        continue-on-error: true
        with:
          sarif_file: "trivy-results.sarif"

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: "${{ env.IMAGE }}@${{ needs.build-push.outputs.image-digest }}"
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ inputs.app-name }}
          path: sbom.spdx.json
          retention-days: 90

  # ── Deploy (update image tag in GitOps repo) ────────────────
  deploy:
    name: Update GitOps
    needs: [build-push, security]
    if: github.ref == 'refs/heads/main' && needs.build-push.result == 'success' && needs.security.result == 'success'
    runs-on: ${{ format('homelab-{0}', github.event.repository.name) }}
    permissions:
      contents: read
    steps:
      - name: Check GITOPS_TOKEN
        id: check-token
        run: |
          if [ -z "$TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::GITOPS_TOKEN not set — skipping GitOps update"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          TOKEN: ${{ secrets.GITOPS_TOKEN }}

      - name: Checkout homelab-apps
        if: steps.check-token.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: web3-frozen/homelab-apps
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main

      - name: Setup Kustomize
        if: steps.check-token.outputs.skip != 'true'
        uses: imranismail/setup-kustomize@53f941b41dca13ed61874bbc6b4b6e1562877530 # v3.0.0

      - name: Update image tag
        if: steps.check-token.outputs.skip != 'true'
        run: |
          cd ${{ inputs.workload-dir }}
          kustomize edit set image ${{ env.IMAGE }}=${{ env.IMAGE }}:${{ needs.build-push.outputs.image-tag }}

      - name: Push deployment branch
        if: steps.check-token.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          APP_NAME: ${{ inputs.app-name }}
          IMAGE_TAG: ${{ needs.build-push.outputs.image-tag }}
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          branch="deploy/${APP_NAME}-${IMAGE_TAG}-${RUN_ID}"
          git checkout -b "$branch"
          git add .
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "deploy(${{ inputs.app-name }}): update image to ${{ needs.build-push.outputs.image-tag }}

          Triggered by ${{ github.repository }}@${{ github.sha }}

          Co-authored-by: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>"
          git push -u origin "$branch"

          gh pr create \
            --repo web3-frozen/homelab-apps \
            --base main \
            --head "$branch" \
            --title "deploy(${APP_NAME}): ${IMAGE_TAG}" \
            --body "Automated image update from ${GITHUB_REPOSITORY}@${GITHUB_SHA}."

          gh pr merge \
            --repo web3-frozen/homelab-apps \
            "$branch" \
            --squash \
            --auto \
            --delete-branch
