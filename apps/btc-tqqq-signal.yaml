apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: btc-tqqq-signal
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "12"
spec:
  project: default
  source:
    repoURL: https://github.com/web3-frozen/homelab-apps.git
    targetRevision: main
    path: workloads/btc-tqqq-signal
  destination:
    server: https://kubernetes.default.svc
    namespace: btc-tqqq-signal
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
