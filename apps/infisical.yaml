apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    chart: infisical-standalone
    targetRevision: "1.12.0"
    helm:
      valuesObject:
        postgresql:
          enabled: true
          primary:
            service:
              annotations:
                config.linkerd.io/opaque-ports: "5432"
        redis:
          enabled: true
          master:
            service:
              annotations:
                config.linkerd.io/opaque-ports: "6379"
        ingress:
          enabled: false
          nginx:
            enabled: false
        infisical:
          image:
            tag: "v0.167.8"
          # Argo CD already rolls the Deployment when the pod template changes.
          # Avoid an extra restart on every render.
          rolloutOnEveryRender: false
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: infisical
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
