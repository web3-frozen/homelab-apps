# Grafana Alloy — replaces the end-of-life Promtail log collector.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: "1.16.0"
    helm:
      valuesObject:
        fullnameOverride: alloy
        controller:
          type: daemonset
        rbac:
          create: false
        serviceAccount:
          automount: false
        service:
          enabled: false
        serviceMonitor:
          enabled: false
        alloy:
          configMap:
            create: true
            content: |-
              loki.source.file "pods" {
                targets = [
                  { __path__ = "/var/log/pods/onchain-monitor_*/*/*.log", namespace = "onchain-monitor" },
                  { __path__ = "/var/log/pods/demo-app_*/*/*.log", namespace = "demo-app" },
                  { __path__ = "/var/log/pods/defi-lending_*/*/*.log", namespace = "defi-lending" },
                  { __path__ = "/var/log/pods/online-boutique_*/*/*.log", namespace = "online-boutique" },
                  { __path__ = "/var/log/pods/redis_*/*/*.log", namespace = "redis" },
                  { __path__ = "/var/log/pods/monitoring_*/*/*.log", namespace = "monitoring" },
                ]
                tail_from_end = true
                forward_to = [loki.write.default.receiver]
                file_match {
                  enabled     = true
                  sync_period = "10s"
                }
              }

              loki.write "default" {
                endpoint {
                  url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
                }
              }
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop:
                - ALL
              add:
                - DAC_READ_SEARCH
            seccompProfile:
              type: RuntimeDefault
          mounts:
            varlog: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
