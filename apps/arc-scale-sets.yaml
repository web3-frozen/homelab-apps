apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-scale-set-controller
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set-controller
    path: .
    targetRevision: "0.15.1"
    helm:
      releaseName: arc
      valuesObject:
        flags:
          logLevel: info
          watchSingleNamespace: actions-runner-system
        metrics:
          controllerManagerAddr: ":8080"
          listenerAddr: ":8080"
          listenerEndpoint: /metrics
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: actions-runner-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-runner-isolation
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/web3-frozen/homelab-apps.git
    path: platform/arc-runners
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: actions-runner-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: arc-hk-home-buy-timer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "11"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
    path: .
    targetRevision: "0.15.1"
    helm:
      releaseName: arc-hk-home-buy-timer
      valuesObject:
        githubConfigUrl: https://github.com/web3-frozen/hk-home-buy-timer
        githubConfigSecret: controller-manager
        runnerScaleSetName: homelab-linux
        minRunners: 0
        maxRunners: 2
        controllerServiceAccount:
          namespace: actions-runner-system
          name: arc-gha-rs-controller
        template:
          metadata:
            labels:
              ci.homelab/isolated-runner: "true"
          spec:
            automountServiceAccountToken: false
            priorityClassName: homelab-ci
            affinity:
              nodeAffinity:
                requiredDuringSchedulingIgnoredDuringExecution:
                  nodeSelectorTerms:
                    - matchExpressions:
                        - key: node-role.kubernetes.io/control-plane
                          operator: DoesNotExist
            securityContext:
              runAsNonRoot: true
              runAsUser: 1001
              runAsGroup: 1001
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: runner
                image: ghcr.io/actions/actions-runner:2.338.2@sha256:6d0b2d80d80f143f77dcb676e50920100bbb547e39e883454d57f45ab8c31300
                command: ["/home/runner/run.sh"]
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop: [ALL]
                resources:
                  requests:
                    cpu: 250m
                    memory: 512Mi
                  limits:
                    cpu: "1"
                    memory: 2Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: actions-runner-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
