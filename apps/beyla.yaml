# Grafana Beyla - zero-code RED metrics and sampled traces.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: beyla
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: beyla
    targetRevision: "1.16.17"
    helm:
      releaseName: beyla
      valuesObject:
        fullnameOverride: beyla
        config:
          create: true
          data:
            discovery:
              instrument:
                - k8s_pod_annotations:
                    beyla.instrument: "true"
                  exports:
                    - metrics
                    - traces
              exclude_instrument:
                - k8s_container_name: linkerd-proxy
            ebpf:
              context_propagation: headers
              track_request_headers: true
            attributes:
              kubernetes:
                enable: true
            prometheus_export:
              path: /metrics
              port: 9090
            otel_traces_export:
              endpoint: http://otel-collector.monitoring.svc.cluster.local:4318
              protocol: http/protobuf
              instrumentations:
                - http
                - grpc
                - sql
                - redis
              sampler:
                name: parentbased_traceidratio
                arg: "1.0"
            filter:
              network:
                k8s_dst_owner_name:
                  not_match: "{kube*,*prometheus*,*grafana-agent*,*node-exporter*}"
                k8s_src_owner_name:
                  not_match: "{kube*,*prometheus*,*grafana-agent*,*node-exporter*}"
        privileged: false
        securityContext:
          privileged: false
          runAsUser: 0
          readOnlyRootFilesystem: true
          capabilities:
            add:
              - BPF
              - PERFMON
              - SYS_PTRACE
              - NET_RAW
              - SYS_RESOURCE
              - DAC_READ_SEARCH
              - CHECKPOINT_RESTORE
              - SYS_ADMIN
            drop:
              - ALL
        service:
          enabled: true
        serviceMonitor:
          enabled: true
          labels: {}
          interval: 30s
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            cpu: 200m
            memory: 1Gi
        tolerations:
          - key: node-role.kubernetes.io/control-plane
            operator: Exists
            effect: NoSchedule
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
