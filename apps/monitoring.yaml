# kube-prometheus-stack is managed by Argo CD after the Pulumi bootstrap.
# Grafana reads its admin credentials from the bootstrap-owned grafana-admin Secret.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: "93.2.2"
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        grafana:
          enabled: true
          annotations:
            reloader.stakater.com/auto: "true"
          admin:
            existingSecret: grafana-admin
            userKey: admin-user
            passwordKey: admin-password
          defaultDashboardsEnabled: false
          deploymentStrategy:
            type: Recreate
          service:
            type: ClusterIP
          persistence:
            enabled: true
            storageClassName: longhorn
            size: 10Gi
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          envValueFrom:
            GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET:
              secretKeyRef:
                name: grafana-oidc
                key: client-secret
          sidecar:
            dashboards:
              enabled: true
              searchNamespace: ALL
              folderAnnotation: grafana_folder
              provider:
                foldersFromFilesStructure: true
          grafana.ini:
            analytics:
              check_for_updates: false
            dashboards:
              default_home_dashboard_path: /tmp/dashboards/Homelab/homelab-overview.json
            server:
              root_url: https://grafana.dummysui.monster
            auth.generic_oauth:
              enabled: true
              name: Authentik
              allow_sign_up: true
              client_id: grafana
              scopes: openid profile email
              auth_url: https://auth.dummysui.monster/application/o/authorize/
              token_url: https://auth.dummysui.monster/application/o/token/
              api_url: https://auth.dummysui.monster/application/o/userinfo/
              role_attribute_path: contains(groups[*], 'homelab-admins') && 'Admin' || 'Viewer'
              role_attribute_strict: false
              use_pkce: true
        prometheus:
          prometheusSpec:
            enableRemoteWriteReceiver: true
            retention: 15d
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            storageSpec:
              volumeClaimTemplate:
                spec:
                  accessModes:
                    - ReadWriteOnce
                  resources:
                    requests:
                      storage: 50Gi
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                cpu: 500m
                memory: 4Gi
        alertmanager:
          enabled: true
          alertmanagerSpec:
            alertmanagerConfigMatcherStrategy:
              type: None
            resources:
              requests:
                cpu: 25m
                memory: 64Mi
              limits:
                cpu: 100m
                memory: 128Mi
        kubeControllerManager:
          enabled: false
        kubeScheduler:
          enabled: false
        kubeProxy:
          enabled: false
        nodeExporter:
          enabled: true
        prometheusOperator:
          admissionWebhooks:
            enabled: false
          tls:
            enabled: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
