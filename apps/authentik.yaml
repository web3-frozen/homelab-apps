# Authentik identity provider. PostgreSQL is managed separately by CloudNativePG.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  project: default
  source:
    repoURL: https://charts.goauthentik.io
    chart: authentik
    targetRevision: "2026.8.6"
    helm:
      releaseName: authentik
      valuesObject:
        global:
          additionalLabels:
            app: authentik
          affinity:
            podAntiAffinity: hard
            nodeAffinity:
              type: hard
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
          image:
            pullPolicy: IfNotPresent
        authentik:
          enabled: true
          existingSecret:
            secretName: authentik-config
          error_reporting:
            enabled: false
          postgresql:
            host: authentik-db-rw.authentik.svc.cluster.local
            name: authentik
            user: authentik
            port: 5432
        blueprints:
          configMaps:
            - authentik-blueprints
        postgresql:
          enabled: false
        server:
          replicas: 2
          deploymentAnnotations:
            reloader.stakater.com/auto: "true"
          deploymentStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
          env:
            - name: AUTHENTIK_WEB__WORKERS
              value: "2"
          pdb:
            enabled: true
            minAvailable: 1
          livenessProbe:
            failureThreshold: 6
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            failureThreshold: 6
            periodSeconds: 15
            timeoutSeconds: 10
          startupProbe:
            failureThreshold: 90
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1500m
              memory: 1536Mi
          service:
            type: ClusterIP
            servicePortHttp: 80
          ingress:
            enabled: false
          metrics:
            serviceMonitor:
              enabled: true
              interval: 30s
        worker:
          replicas: 2
          deploymentAnnotations:
            reloader.stakater.com/auto: "true"
          deploymentStrategy:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 1
              maxUnavailable: 0
          pdb:
            enabled: true
            minAvailable: 1
          livenessProbe:
            failureThreshold: 6
            periodSeconds: 15
            timeoutSeconds: 10
          readinessProbe:
            failureThreshold: 6
            periodSeconds: 15
            timeoutSeconds: 10
          startupProbe:
            failureThreshold: 90
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          metrics:
            serviceMonitor:
              enabled: true
              interval: 30s
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - PruneLast=true
