apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: goldilocks
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.fairwinds.com/stable
    chart: goldilocks
    targetRevision: "11.2.1"
    helm:
      valuesObject:
        vpa:
          enabled: true
          recommender:
            image:
              # VPA 1.7.1 crashes while loading existing VPAs on Kubernetes 1.34.
              # Keep the current chart while pinning the recommender to 1.6.0.
              tag: "1.6.0"
        dashboard:
          replicaCount: 1
  destination:
    server: https://kubernetes.default.svc
    namespace: goldilocks
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
