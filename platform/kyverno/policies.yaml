# CEL replacements for the three legacy ClusterPolicies. Apply before pruning
# the legacy resources so enforcement remains active during the migration.
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    policies.kyverno.io/category: Pod Security Standards (Baseline)
    policies.kyverno.io/severity: high
spec:
  validationActions: [Deny]
  autogen:
    podControllers:
      controllers: [daemonsets, deployments, jobs, replicasets, replicationcontrollers, statefulsets, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, linkerd, linkerd-viz, longhorn-system, cnpg-system, infisical, kyverno, actions-runner-system]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - message: Privileged mode is disallowed.
      expression: >-
        (object.spec.containers + object.spec.?initContainers.orValue([]) +
          object.spec.?ephemeralContainers.orValue([]))
        .all(c, !c.?securityContext.privileged.orValue(false))
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-resource-limits
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    policies.kyverno.io/severity: medium
spec:
  validationActions: [Audit]
  autogen:
    podControllers:
      controllers: [daemonsets, deployments, jobs, replicasets, replicationcontrollers, statefulsets, cronjobs]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, argocd, monitoring, linkerd, linkerd-viz, actions-runner-system]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - message: CPU and memory limits are required.
      expression: >-
        object.spec.containers.all(c, ['cpu', 'memory'].all(k,
          k in c.?resources.limits.orValue({})))
---
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: require-labels
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    policies.kyverno.io/severity: low
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: NotIn
          values: [kube-system, argocd, monitoring]
    resourceRules:
      - apiGroups: [apps]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [deployments, statefulsets]
  validations:
    - message: Either 'app' or 'app.kubernetes.io/name' is required.
      expression: >-
        ['app', 'app.kubernetes.io/name'].exists(k,
          object.metadata.?labels[k].orValue('') != '')
