apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: homelab-apps-runner
  namespace: actions-runner-system
spec:
  replicas: 1
  template:
    spec:
      repository: web3-frozen/homelab-apps
      labels:
        - self-hosted
        - k3s
        - homelab
      image: summerwind/actions-runner:v2.338.2-ubuntu-24.04
      ephemeral: true
      resources:
        requests:
          cpu: 200m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 2Gi
