---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token-secret
    creationPolicy: Owner
    template:
      data:
        api-token: "{{ .api_token }}"
  data:
    - secretKey: api_token
      remoteRef:
        key: INFRA_CLOUDFLARE_API_TOKEN
