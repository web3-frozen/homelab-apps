apiVersion: v1
kind: ServiceAccount
metadata:
  name: linkerd-trust-bundle
  namespace: linkerd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: linkerd-trust-bundle
  namespace: linkerd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - linkerd-trust-anchor-v2
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - linkerd-identity-trust-roots
    verbs: ["get", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: linkerd-trust-bundle
  namespace: linkerd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
subjects:
  - kind: ServiceAccount
    name: linkerd-trust-bundle
    namespace: linkerd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: linkerd-trust-bundle
---
apiVersion: batch/v1
kind: Job
metadata:
  name: linkerd-trust-bundle-v2
  namespace: linkerd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  selector:
    matchLabels:
      app.kubernetes.io/name: linkerd-trust-bundle
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linkerd-trust-bundle
    spec:
      serviceAccountName: linkerd-trust-bundle
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bundle
          image: alpine:3.23
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              apk add --no-cache ca-certificates curl >/dev/null

              KUBECTL_VERSION=v1.34.5
              ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
              curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl"
              curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl.sha256"
              echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
              chmod +x kubectl && mv kubectl /usr/local/bin/

              for attempt in $(seq 1 60); do
                if kubectl get secret linkerd-trust-anchor-v2 -n linkerd >/dev/null 2>&1; then
                  break
                fi
                if [ "$attempt" = 60 ]; then
                  echo "Timed out waiting for the v2 Linkerd trust anchor."
                  exit 1
                fi
                sleep 5
              done

              kubectl get secret linkerd-trust-anchor-v2 -n linkerd \
                -o jsonpath='{.data.tls\.crt}' | base64 -d > /tmp/trust-roots.crt

              kubectl create configmap linkerd-identity-trust-roots -n linkerd \
                --from-file=ca-bundle.crt=/tmp/trust-roots.crt \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "Configured Linkerd trust roots from cert-manager v2."
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
