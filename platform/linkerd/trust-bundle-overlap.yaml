apiVersion: v1
kind: ServiceAccount
metadata:
  name: linkerd-trust-bundle-overlap
  namespace: linkerd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: linkerd-trust-bundle-overlap
  namespace: linkerd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - linkerd-trust-anchor-v2
      - linkerd-identity-issuer-v2
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - linkerd-identity-trust-roots
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: linkerd-trust-bundle-overlap
  namespace: linkerd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
subjects:
  - kind: ServiceAccount
    name: linkerd-trust-bundle-overlap
    namespace: linkerd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: linkerd-trust-bundle-overlap
---
apiVersion: batch/v1
kind: Job
metadata:
  name: linkerd-trust-bundle-overlap
  namespace: linkerd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: linkerd-trust-bundle-overlap
    spec:
      serviceAccountName: linkerd-trust-bundle-overlap
      restartPolicy: OnFailure
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: overlap
          image: alpine:3.23
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              apk add --no-cache ca-certificates curl >/dev/null

              KUBECTL_VERSION=v1.34.5
              ARCH="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
              curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl"
              curl -fsSLO "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${ARCH}/kubectl.sha256"
              echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
              chmod +x kubectl && mv kubectl /usr/local/bin/

              for attempt in $(seq 1 60); do
                if kubectl get secret linkerd-trust-anchor-v2 -n linkerd >/dev/null 2>&1 &&
                   kubectl get secret linkerd-identity-issuer-v2 -n linkerd >/dev/null 2>&1; then
                  break
                fi
                if [ "$attempt" = 60 ]; then
                  echo "Timed out waiting for cert-manager Linkerd certificates."
                  exit 1
                fi
                sleep 5
              done

              kubectl get configmap linkerd-identity-trust-roots -n linkerd \
                -o jsonpath='{.data.ca-bundle\.crt}' > /tmp/existing-roots.crt
              kubectl get secret linkerd-trust-anchor-v2 -n linkerd \
                -o jsonpath='{.data.tls\.crt}' | base64 -d > /tmp/new-root.crt

              cp /tmp/existing-roots.crt /tmp/overlap-roots.crt
              printf '\n' >> /tmp/overlap-roots.crt
              cat /tmp/new-root.crt >> /tmp/overlap-roots.crt

              kubectl create configmap linkerd-identity-trust-roots -n linkerd \
                --from-file=ca-bundle.crt=/tmp/overlap-roots.crt \
                --dry-run=client -o yaml | kubectl apply -f -

              echo "Added the v2 root to the Linkerd overlap trust bundle."
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
