# Push existing bootstrap/app credentials into Infisical. DeletionPolicy None
# prevents GitOps deletion from removing the remote value. Most entries use
# IfNotExists (seed once); CloudNativePG passwords use Replace because the
# operator can rotate them.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: cloudflare-tunnel-token
  namespace: cloudflare
spec:
  refreshInterval: 1h
  deletionPolicy: None
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: infisical
      kind: ClusterSecretStore
  selector:
    secret:
      name: cloudflare-tunnel-token
  data:
    - match:
        secretKey: token
        remoteRef:
          remoteKey: INFRA_CLOUDFLARE_TUNNEL_TOKEN
---
