---
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: demo-db-app-password
  namespace: demo-app
spec:
  refreshInterval: 1h
  deletionPolicy: None
  # CloudNativePG can rotate the generated app password. Keep Infisical in step
  # instead of freezing the first observed value.
  updatePolicy: Replace
  secretStoreRefs:
    - name: infisical
      kind: ClusterSecretStore
  selector:
    secret:
      name: demo-db-app
  data:
    - match:
        secretKey: password
        remoteRef:
          remoteKey: INFRA_DEMO_DB_PASSWORD
---
