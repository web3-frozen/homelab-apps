apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: longhorn-offhost-s3
  namespace: longhorn-system
spec:
  refreshInterval: 1h
  deletionPolicy: None
  updatePolicy: IfNotExists
  secretStoreRefs:
    - name: infisical
      kind: ClusterSecretStore
  selector:
    secret:
      name: homelab-offhost-s3
  data:
    - match:
        secretKey: AWS_ACCESS_KEY_ID
        remoteRef:
          remoteKey: INFRA_LONGHORN_S3_ACCESS_KEY_ID
    - match:
        secretKey: AWS_SECRET_ACCESS_KEY
        remoteRef:
          remoteKey: INFRA_LONGHORN_S3_SECRET_ACCESS_KEY
    - match:
        secretKey: AWS_ENDPOINTS
        remoteRef:
          remoteKey: INFRA_LONGHORN_S3_ENDPOINTS
    - match:
        secretKey: AWS_CERT
        remoteRef:
          remoteKey: INFRA_LONGHORN_S3_CERT
---
