apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-credentials
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-renovate
    kind: ClusterSecretStore
  target:
    name: renovate-credentials
    creationPolicy: Owner
  data:
    - secretKey: app-id
      remoteRef:
        key: RENOVATE_APP_ID
    - secretKey: installation-id
      remoteRef:
        key: RENOVATE_INSTALLATION_ID
    - secretKey: private-key
      remoteRef:
        key: RENOVATE_APP_PRIVATE_KEY
