apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-ghcr
  namespace: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: renovate-ghcr
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: BTC_TQQQ_GHCR_READ_TOKEN
