apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - alertmanager-config.yaml
  - alertmanager-telegram-externalsecret.yaml
  - grafana-admin-externalsecret.yaml
  - grafana-loki-datasource.yaml
  - grafana-tempo-datasource.yaml

configMapGenerator:
  - name: grafana-dashboard-homelab
    files:
      - homelab-overview.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Homelab
  - name: grafana-dashboard-apm
    files:
      - apm-overview.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Homelab
  - name: grafana-dashboard-onchain
    files:
      - onchain-monitor.json
    options:
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Homelab

generatorOptions:
  disableNameSuffixHash: true
