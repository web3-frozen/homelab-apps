# Grafana Dashboard — service and dependency latency.
# Auto-provisioned by the Grafana sidecar (label: grafana_dashboard=1).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-apm
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: "APM"
data:
  apm-service-latency.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "title": "Request Rate",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{k8s_namespace_name=~\"$namespace\"}[$__rate_interval]))",
              "legendFormat": "requests/sec"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "decimals": 2 }
          }
        },
        {
          "title": "5xx Error Rate",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "expr": "sum(rate(http_server_request_duration_seconds_count{k8s_namespace_name=~\"$namespace\",http_response_status_code=~\"5..\"}[$__rate_interval])) / clamp_min(sum(rate(http_server_request_duration_seconds_count{k8s_namespace_name=~\"$namespace\"}[$__rate_interval])), 0.000001)",
              "legendFormat": "5xx"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 0.01 },
                  { "color": "red", "value": 0.05 }
                ]
              }
            }
          }
        },
        {
          "title": "Beyla-Instrumented Services",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "count(count by (k8s_deployment_name) (http_server_request_duration_seconds_count{k8s_namespace_name=~\"$namespace\"}))",
              "legendFormat": "services"
            }
          ]
        },
        {
          "title": "Trace Spans (5m)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "targets": [
            {
              "expr": "sum(increase(tempo_distributor_spans_received_total[5m]))",
              "legendFormat": "spans"
            }
          ],
          "options": {
            "textMode": "auto"
          }
        },
        {
          "title": "Server Latency p50 / p95 / p99 by Service",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "histogram_quantile(0.50, sum by (le,k8s_deployment_name) (rate(http_server_request_duration_seconds_bucket{k8s_namespace_name=~\"$namespace\"}[$__rate_interval])))",
              "legendFormat": "p50 {{k8s_deployment_name}}"
            },
            {
              "expr": "histogram_quantile(0.95, sum by (le,k8s_deployment_name) (rate(http_server_request_duration_seconds_bucket{k8s_namespace_name=~\"$namespace\"}[$__rate_interval])))",
              "legendFormat": "p95 {{k8s_deployment_name}}"
            },
            {
              "expr": "histogram_quantile(0.99, sum by (le,k8s_deployment_name) (rate(http_server_request_duration_seconds_bucket{k8s_namespace_name=~\"$namespace\"}[$__rate_interval])))",
              "legendFormat": "p99 {{k8s_deployment_name}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 8, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "Downstream Client Latency p95 by Caller and Upstream",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 13 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le,k8s_deployment_name,server_address) (rate(http_client_request_duration_seconds_bucket{k8s_namespace_name=~\"$namespace\"}[$__rate_interval])))",
              "legendFormat": "{{k8s_deployment_name}} -> {{server_address}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 8, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "Slowest Backend Routes (p95, 5m)",
          "type": "table",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 22 },
          "targets": [
            {
              "expr": "topk(15, histogram_quantile(0.95, sum by (le,k8s_deployment_name,http_route) (rate(http_server_request_duration_seconds_bucket{k8s_namespace_name=~\"$namespace\"}[5m]))))",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "__name__": true },
                "renameByName": {
                  "k8s_deployment_name": "Service",
                  "http_route": "Route",
                  "Value": "p95 (s)"
                }
              }
            }
          ]
        },
        {
          "title": "Slowest Upstream Calls (p95, 5m)",
          "type": "table",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 22 },
          "targets": [
            {
              "expr": "topk(15, histogram_quantile(0.95, sum by (le,k8s_deployment_name,server_address,http_route) (rate(http_client_request_duration_seconds_bucket{k8s_namespace_name=~\"$namespace\"}[5m]))))",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "__name__": true },
                "renameByName": {
                  "k8s_deployment_name": "Caller",
                  "server_address": "Upstream",
                  "http_route": "Route",
                  "Value": "p95 (s)"
                }
              }
            }
          ]
        },
        {
          "title": "Onchain Data Source Fetch Latency p95",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 31 },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le,source) (rate(onchain_monitor_poll_duration_seconds_bucket[5m])))",
              "legendFormat": "{{source}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "drawStyle": "line", "fillOpacity": 12, "lineWidth": 2 }
            }
          }
        },
        {
          "title": "Slowest Data Sources (p95, 5m)",
          "type": "table",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 40 },
          "targets": [
            {
              "expr": "topk(20, histogram_quantile(0.95, sum by (le,source) (rate(onchain_monitor_poll_duration_seconds_bucket[5m]))))",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true, "__name__": true },
                "renameByName": { "source": "Source", "Value": "p95 (s)" }
              }
            }
          ]
        },
        {
          "title": "Onchain Poll Failure Rate by Source",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 40 },
          "targets": [
            {
              "expr": "sum by (source) (rate(onchain_monitor_poll_total{status!=\"success\"}[$__rate_interval])) / clamp_min(sum by (source) (rate(onchain_monitor_poll_total[$__rate_interval])), 0.000001)",
              "legendFormat": "{{source}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "custom": { "drawStyle": "line", "fillOpacity": 12, "lineWidth": 2 }
            }
          }
        }
      ],
      "schemaVersion": 39,
      "tags": ["apm", "beyla", "tempo", "latency"],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "label": "Namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "query": "label_values(http_server_request_duration_seconds_count, k8s_namespace_name)",
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "current": { "selected": true, "text": "All", "value": "$__all" },
            "refresh": 1,
            "sort": 1
          }
        ]
      },
      "time": { "from": "now-1h", "to": "now" },
      "title": "APM — Service and Dependency Latency",
      "uid": "apm-service-latency"
    }
