apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: homelab-ci
value: -10
preemptionPolicy: Never
globalDefault: false
description: Batch CI runs below production workloads without preempting them.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ephemeral-ci-capacity
  namespace: actions-runner-system
spec:
  hard:
    pods: "4"
    requests.cpu: "2"
    requests.memory: 4Gi
    # Four image-build runners fit. Each builder requests 500m/1Gi and limits 2 CPU/3.5Gi.
    limits.cpu: "8"
    limits.memory: 16Gi
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values: [homelab-ci]
