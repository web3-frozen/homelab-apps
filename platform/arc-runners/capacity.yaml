apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: homelab-ci
value: -10
preemptionPolicy: Never
globalDefault: false
description: Batch CI runs below production workloads without preempting them.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ephemeral-ci-capacity
  namespace: actions-runner-system
spec:
  hard:
    pods: "12"
    requests.cpu: "6"
    requests.memory: 12Gi
    # 12 slots: SiteSight may use up to 10 (scale set max), leaving two for a
    # short validation/refresh job from any other repository.
    # Each builder requests 500m/1Gi and limits 2 CPU/3.5Gi.
    limits.cpu: "24"
    limits.memory: 44Gi
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values: [homelab-ci]
