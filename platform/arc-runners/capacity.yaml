apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: homelab-ci
value: -10
preemptionPolicy: Never
globalDefault: false
description: Batch CI runs below production workloads without preempting them.
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ephemeral-ci-capacity
  namespace: actions-runner-system
spec:
  hard:
    pods: "6"
    requests.cpu: "3"
    requests.memory: 6Gi
    # Six runners leave room for short validation jobs alongside image builds.
    # Each builder requests 500m/1Gi and limits 2 CPU/3.5Gi.
    limits.cpu: "12"
    limits.memory: 24Gi
  scopeSelector:
    matchExpressions:
      - scopeName: PriorityClass
        operator: In
        values: [homelab-ci]
