---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-config
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: authentik-config
    creationPolicy: Owner
    template:
      data:
        AUTHENTIK_SECRET_KEY: "{{ .secret_key }}"
        AUTHENTIK_POSTGRESQL__HOST: authentik-db-rw.authentik.svc.cluster.local
        AUTHENTIK_POSTGRESQL__NAME: authentik
        AUTHENTIK_POSTGRESQL__USER: authentik
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .db_password }}"
        AUTHENTIK_POSTGRESQL__PORT: "5432"
        AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .bootstrap_password }}"
        AUTHENTIK_BOOTSTRAP_TOKEN: "{{ .bootstrap_token }}"
        AUTHENTIK_BOOTSTRAP_EMAIL: admin@dummysui.monster
        AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
        AUTHENTIK_ARGOCD_CLIENT_SECRET: "{{ .argocd_client_secret }}"
        AUTHENTIK_GRAFANA_CLIENT_SECRET: "{{ .grafana_client_secret }}"
  data:
    - secretKey: secret_key
      remoteRef:
        key: INFRA_AUTHENTIK_SECRET_KEY
    - secretKey: db_password
      remoteRef:
        key: INFRA_AUTHENTIK_DB_PASSWORD
    - secretKey: bootstrap_password
      remoteRef:
        key: INFRA_AUTHENTIK_BOOTSTRAP_PASSWORD
    - secretKey: bootstrap_token
      remoteRef:
        key: INFRA_AUTHENTIK_BOOTSTRAP_TOKEN
    - secretKey: argocd_client_secret
      remoteRef:
        key: INFRA_AUTHENTIK_ARGOCD_CLIENT_SECRET
    - secretKey: grafana_client_secret
      remoteRef:
        key: INFRA_AUTHENTIK_GRAFANA_CLIENT_SECRET
