---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-ip-allowlist
  namespace: authentik
spec:
  ipAllowList:
    sourceRange:
      - 221.124.77.37/32
    ipStrategy:
      depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: authentik
  namespace: authentik
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`auth.dummysui.monster`)
      middlewares:
        - name: authentik-ip-allowlist
      services:
        - name: authentik-server
          port: 80
