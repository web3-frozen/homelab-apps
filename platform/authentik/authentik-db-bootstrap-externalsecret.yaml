---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-db-bootstrap
  namespace: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: authentik-db-bootstrap
    creationPolicy: Owner
    template:
      data:
        username: authentik
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: INFRA_AUTHENTIK_DB_PASSWORD
