---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: infisical-ip-allowlist
  namespace: authentik
spec:
  ipAllowList:
    sourceRange:
      - 221.124.77.37/32
    ipStrategy:
      depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: infisical
  namespace: authentik
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`infisical.dummysui.monster`)
      middlewares:
        - name: infisical-ip-allowlist
      services:
        - name: infisical-infisical-standalone-infisical
          namespace: infisical
          port: 8080
