apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: btc-tqqq-bitget
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: btc-tqqq-bitget
    creationPolicy: Owner
  data:
    - secretKey: BITGET_API_KEY
      remoteRef:
        key: BTC_TQQQ_BITGET_API_KEY
    - secretKey: BITGET_API_SECRET
      remoteRef:
        key: BTC_TQQQ_BITGET_API_SECRET
    - secretKey: BITGET_API_PASSPHRASE
      remoteRef:
        key: BTC_TQQQ_BITGET_API_PASSPHRASE
