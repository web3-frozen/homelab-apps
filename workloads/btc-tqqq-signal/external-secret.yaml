apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: btc-tqqq-ghcr-pull
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: ghcr-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "web3-frozen:%s" .token | b64enc }}"}}}'
  data:
    - secretKey: token
      remoteRef:
        key: BTC_TQQQ_GHCR_READ_TOKEN
