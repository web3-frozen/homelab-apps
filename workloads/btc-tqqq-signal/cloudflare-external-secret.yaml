apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-shared
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: cloudflare-shared
    creationPolicy: Owner
  data:
    - secretKey: CLOUDFLARE_API_TOKEN
      remoteRef:
        key: INFRA_CLOUDFLARE_SHARED_API_TOKEN
    - secretKey: CLOUDFLARE_ACCOUNT_ID
      remoteRef:
        key: INFRA_CLOUDFLARE_ACCOUNT_ID
    - secretKey: D1_DATABASE_ID
      remoteRef:
        key: INFRA_D1_DATABASE_ID
    - secretKey: R2_ENDPOINT
      remoteRef:
        key: INFRA_R2_ENDPOINT
    - secretKey: R2_BUCKET
      remoteRef:
        key: INFRA_R2_BUCKET
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef:
        key: INFRA_R2_ACCESS_KEY_ID
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef:
        key: INFRA_R2_SECRET_ACCESS_KEY
