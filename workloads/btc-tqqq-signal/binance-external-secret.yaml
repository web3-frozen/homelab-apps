apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: btc-tqqq-binance
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: btc-tqqq-binance
    creationPolicy: Owner
  data:
    - secretKey: BINANCE_API_KEY
      remoteRef:
        key: BTC_TQQQ_BINANCE_API_KEY
    - secretKey: BINANCE_API_SECRET
      remoteRef:
        key: BTC_TQQQ_BINANCE_API_SECRET
