apiVersion: batch/v1
kind: CronJob
metadata:
  name: btc-tqqq-signal
spec:
  schedule: "20 8 * * *"
  timeZone: Asia/Hong_Kong
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 7200
  successfulJobsHistoryLimit: 14
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: btc-tqqq-signal
          annotations:
            linkerd.io/inject: disabled
        spec:
          imagePullSecrets:
            - name: ghcr-pull-secret
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: signals
              image: ghcr.io/web3-frozen/btc-tqqq-signal
              imagePullPolicy: Always
              command: ["python", "-B", "-u", "/app/signal_monitor.py"]
              resources:
                requests: {cpu: 25m, memory: 32Mi}
                limits: {cpu: 250m, memory: 128Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: btc-tqqq-binance
spec:
  # Schedules use HKT. US-market hours need review when US DST changes.
  schedule: "20 8 * * 1"
  timeZone: Asia/Hong_Kong
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 21600
  successfulJobsHistoryLimit: 14
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: btc-tqqq-signal
            app.kubernetes.io/component: binance-executor
          annotations:
            linkerd.io/inject: disabled
        spec:
          imagePullSecrets:
            - name: ghcr-pull-secret
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: binance
              image: ghcr.io/web3-frozen/btc-tqqq-signal
              imagePullPolicy: Always
              command: ["python", "-B", "-u", "/app/trade.py", "--flow", "A", "--brokers", "binance", "--state-dir", "/var/lib/btc-tqqq"]
              envFrom:
                - configMapRef:
                    name: btc-tqqq-broker-config
                - secretRef:
                    name: btc-tqqq-binance
                - secretRef:
                    name: btc-tqqq-telegram
              volumeMounts:
                - {name: state, mountPath: /var/lib/btc-tqqq}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 50m, memory: 64Mi}
                limits: {cpu: 500m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: btc-tqqq-state
            - name: tmp
              emptyDir: {}
---
