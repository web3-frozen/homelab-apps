apiVersion: batch/v1
kind: CronJob
metadata:
  name: btc-tqqq-bitget-snapshot
spec:
  schedule: "5 8 * * *"
  timeZone: Asia/Hong_Kong
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 14
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: btc-tqqq-signal
            app.kubernetes.io/component: bitget-snapshot
          annotations:
            linkerd.io/inject: disabled
        spec:
          imagePullSecrets:
            - name: ghcr-pull-secret
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: snapshot
              image: ghcr.io/web3-frozen/btc-tqqq-signal
              imagePullPolicy: Always
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  python -B -u /app/trade.py --snapshot --state-dir /var/lib/btc-tqqq
                  && python -B -u /app/trade.py --allocate-savings
                  ;
                  python -B -u /app/report.py --db /var/lib/btc-tqqq/bitget.sqlite3
                  --out /var/lib/btc-tqqq/report.html --upload --prefix btc-tqqq/latest
              envFrom:
                - configMapRef:
                    name: btc-tqqq-broker-config
                - secretRef:
                    name: btc-tqqq-bitget
                - secretRef:
                    name: cloudflare-shared
                    optional: true
                - secretRef:
                    name: btc-tqqq-telegram
              volumeMounts:
                - {name: state, mountPath: /var/lib/btc-tqqq}
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 50m, memory: 128Mi}
                limits: {cpu: 500m, memory: 512Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
          volumes:
            - name: state
              persistentVolumeClaim:
                claimName: btc-tqqq-state
            - name: tmp
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: btc-tqqq-savings-sweep
spec:
  schedule: "30 8 * * *"
  timeZone: Asia/Hong_Kong
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 14
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/name: btc-tqqq-signal
            app.kubernetes.io/component: savings-sweep
          annotations:
            linkerd.io/inject: disabled
        spec:
          imagePullSecrets:
            - name: ghcr-pull-secret
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sweep
              image: ghcr.io/web3-frozen/btc-tqqq-signal
              imagePullPolicy: Always
              command: ["python", "-B", "-u", "/app/trade.py", "--sweep-savings"]
              envFrom:
                - configMapRef:
                    name: btc-tqqq-broker-config
                - secretRef:
                    name: btc-tqqq-bitget
              env:
                - {name: HOME, value: /tmp}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
              resources:
                requests: {cpu: 25m, memory: 64Mi}
                limits: {cpu: 200m, memory: 256Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
          volumes:
            - name: tmp
              emptyDir: {}
