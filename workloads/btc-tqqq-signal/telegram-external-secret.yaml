apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: btc-tqqq-telegram
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: btc-tqqq-telegram
    creationPolicy: Owner
  data:
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: INFRA_TELEGRAM_BOT_TOKEN
    - secretKey: TELEGRAM_CHAT_ID
      remoteRef:
        key: INFRA_TELEGRAM_BOT_CHAT_ID
