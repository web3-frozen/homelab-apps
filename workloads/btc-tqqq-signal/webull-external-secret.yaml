apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: btc-tqqq-webull
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: btc-tqqq-webull
    creationPolicy: Owner
  data:
    - secretKey: WEBULL_APP_KEY
      remoteRef:
        key: BTC_TQQQ_WEBULL_APP_KEY
    - secretKey: WEBULL_APP_SECRET
      remoteRef:
        key: BTC_TQQQ_WEBULL_APP_SECRET
