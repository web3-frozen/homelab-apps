apiVersion: v1
kind: ConfigMap
metadata:
  name: btc-tqqq-report-server
  labels:
    app.kubernetes.io/name: btc-tqqq-signal
    app.kubernetes.io/component: report-server
data:
  report_server.py: |
    #!/usr/bin/env python3
    """Serve the latest R2 report for the IP-allowlisted Traefik route."""

    import http.server
    import os
    import threading
    import time

    import boto3

    KEY = os.getenv("REPORT_KEY", "btc-tqqq/latest/report.html")
    INTERVAL = max(15, int(os.getenv("REPORT_REFRESH_SECONDS", "60")))
    PORT = int(os.getenv("PORT", "8080"))
    BODY = {"data": None, "updated": 0.0}
    LOCK = threading.Lock()


    def client():
        return boto3.client(
            "s3",
            endpoint_url=os.environ["R2_ENDPOINT"],
            aws_access_key_id=os.environ["R2_ACCESS_KEY_ID"],
            aws_secret_access_key=os.environ["R2_SECRET_ACCESS_KEY"],
            region_name="auto",
        )


    def fetch_once(s3):
        obj = s3.get_object(Bucket=os.environ["R2_BUCKET"], Key=KEY)
        data = obj["Body"].read()
        with LOCK:
            BODY["data"] = data
            BODY["updated"] = time.time()
        return len(data)


    def refresh(s3):
        while True:
            try:
                size = fetch_once(s3)
                print(f"report refreshed: {size} bytes", flush=True)
            except Exception as error:
                print(f"report refresh failed: {error}", flush=True)
            time.sleep(INTERVAL)


    class Handler(http.server.BaseHTTPRequestHandler):
        def do_GET(self):
            self.serve(False)

        def do_HEAD(self):
            self.serve(True)

        def serve(self, head_only):
            if self.path not in ("/", "/index.html", "/report.html"):
                self.send_error(404)
                return
            with LOCK:
                data = BODY["data"]
            if data is None:
                self.send_response(503)
                self.send_header("Content-Type", "text/plain; charset=utf-8")
                self.send_header("Retry-After", "30")
                self.end_headers()
                if not head_only:
                    self.wfile.write(b"Report not available yet\n")
                return
            self.send_response(200)
            self.send_header("Content-Type", "text/html; charset=utf-8")
            self.send_header("Cache-Control", "no-store")
            self.send_header("Content-Length", str(len(data)))
            self.end_headers()
            if not head_only:
                self.wfile.write(data)

        def log_message(self, *args):
            pass


    def main():
        s3 = client()
        try:
            fetch_once(s3)
        except Exception as error:
            print(f"initial report fetch failed: {error}", flush=True)
        threading.Thread(target=refresh, args=(s3,), daemon=True).start()
        http.server.ThreadingHTTPServer(("0.0.0.0", PORT), Handler).serve_forever()


    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: btc-tqqq-report
  labels:
    app.kubernetes.io/name: btc-tqqq-signal
    app.kubernetes.io/component: report-server
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: btc-tqqq-signal
      app.kubernetes.io/component: report-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: btc-tqqq-signal
        app.kubernetes.io/component: report-server
      annotations:
        linkerd.io/inject: disabled
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: report
          image: ghcr.io/web3-frozen/btc-tqqq-signal
          imagePullPolicy: Always
          command: ["python", "-B", "-u", "/opt/report-server/report_server.py"]
          env:
            - name: PORT
              value: "8080"
            - name: REPORT_KEY
              value: btc-tqqq/latest/report.html
            - name: REPORT_REFRESH_SECONDS
              value: "60"
          envFrom:
            - secretRef:
                name: cloudflare-shared
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 5
          volumeMounts:
            - name: script
              mountPath: /opt/report-server
              readOnly: true
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {cpu: 200m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: script
          configMap:
            name: btc-tqqq-report-server
---
apiVersion: v1
kind: Service
metadata:
  name: btc-tqqq-report
  labels:
    app.kubernetes.io/name: btc-tqqq-signal
    app.kubernetes.io/component: report-server
spec:
  selector:
    app.kubernetes.io/name: btc-tqqq-signal
    app.kubernetes.io/component: report-server
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: btc-tqqq-report-ip-allowlist
  labels:
    app.kubernetes.io/name: btc-tqqq-signal
    app.kubernetes.io/component: report-server
spec:
  ipAllowList:
    sourceRange:
      - 221.124.77.37/32
    ipStrategy:
      depth: 1
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: btc-tqqq-report
  labels:
    app.kubernetes.io/name: btc-tqqq-signal
    app.kubernetes.io/component: report-server
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`btc-tqqq.dummysui.monster`)
      middlewares:
        - name: btc-tqqq-report-ip-allowlist
      services:
        - name: btc-tqqq-report
          port: 80
