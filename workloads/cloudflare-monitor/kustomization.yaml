apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cloudflare-monitor

resources:
  - namespace.yaml
  - external-secret.yaml
  - deployment.yaml
  - service.yaml
  - servicemonitor.yaml
  - prometheusrules.yaml
  - network-policy.yaml

configMapGenerator:
  - name: cloudflare-quota-exporter-script
    files:
      - exporter.py
    options:
      labels:
        app: cloudflare-quota-exporter
