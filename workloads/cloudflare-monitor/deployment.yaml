# Cloudflare Workers/D1/R2 free-tier usage exporter.
# The Python script is mounted from the kustomize-generated ConfigMap; it
# refreshes a cached snapshot every 5 minutes and serves Prometheus metrics.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare-quota-exporter
  labels:
    app: cloudflare-quota-exporter
    app.kubernetes.io/name: cloudflare-quota-exporter
    app.kubernetes.io/part-of: cloudflare-monitor
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: cloudflare-quota-exporter
  template:
    metadata:
      labels:
        app: cloudflare-quota-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/app/exporter.py"]
          env:
            - name: CF_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-quota
                  key: CF_API_TOKEN
            - name: CF_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: cloudflare-quota
                  key: CF_ACCOUNT_ID
            - name: PORT
              value: "9103"
            - name: REFRESH_SECONDS
              value: "300"
            - name: LOG_LEVEL
              value: "INFO"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          ports:
            - name: http
              containerPort: 9103
              protocol: TCP
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /app
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: cloudflare-quota-exporter-script
        - name: tmp
          emptyDir: {}
