# Account-scoped Cloudflare token shared with the homelab workloads.
# Only the read-only usage APIs are queried (GraphQL analytics, D1/R2 lists).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-quota
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: cloudflare-quota
    creationPolicy: Owner
  data:
    - secretKey: CF_API_TOKEN
      remoteRef:
        key: INFRA_CLOUDFLARE_SHARED_API_TOKEN
    - secretKey: CF_ACCOUNT_ID
      remoteRef:
        key: INFRA_CLOUDFLARE_ACCOUNT_ID
