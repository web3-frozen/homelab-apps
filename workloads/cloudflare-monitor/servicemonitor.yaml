apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudflare-quota-exporter
  labels:
    app: cloudflare-quota-exporter
    app.kubernetes.io/part-of: cloudflare-monitor
spec:
  selector:
    matchLabels:
      app: cloudflare-quota-exporter
  endpoints:
    - port: http
      path: /metrics
      interval: 60s
      scrapeTimeout: 30s
