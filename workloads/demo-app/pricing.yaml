# Demo pricing service: exposes the third-party data dependency in traces.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-pricing
  namespace: demo-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-pricing
  namespace: demo-app
  labels:
    app: demo-pricing
    app.kubernetes.io/name: demo-pricing
    app.kubernetes.io/part-of: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-pricing
  template:
    metadata:
      labels:
        app: demo-pricing
        app.kubernetes.io/name: demo-pricing
      annotations:
        linkerd.io/inject: enabled
        beyla.instrument: "true"
        resource.opentelemetry.io/service.name: "demo-pricing"
        resource.opentelemetry.io/service.version: "poc"
    spec:
      serviceAccountName: demo-pricing
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-pricing
          image: ghcr.io/web3-frozen/demo-pricing
          ports:
            - containerPort: 8082
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "8082"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
                  optional: true
            - name: REDIS_URL
              value: "redis://default:$(REDIS_PASSWORD)@redis-master.redis.svc.cluster.local:6379/0"
            - name: MARKET_DATA_URL
              value: "https://api.frankfurter.app/latest?from=USD&to=EUR"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 150m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: demo-pricing
  namespace: demo-app
  labels:
    app: demo-pricing
spec:
  selector:
    app: demo-pricing
  ports:
    - port: 8082
      targetPort: http
      name: http
      protocol: TCP
