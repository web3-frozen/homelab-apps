# Demo inventory service: orchestrates checkout, PostgreSQL, Redis, and pricing.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: demo-inventory
  namespace: demo-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-inventory
  namespace: demo-app
  labels:
    app: demo-inventory
    app.kubernetes.io/name: demo-inventory
    app.kubernetes.io/part-of: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-inventory
  template:
    metadata:
      labels:
        app: demo-inventory
        app.kubernetes.io/name: demo-inventory
      annotations:
        linkerd.io/inject: enabled
        beyla.instrument: "true"
        resource.opentelemetry.io/service.name: "demo-inventory"
        resource.opentelemetry.io/service.version: "poc"
    spec:
      serviceAccountName: demo-inventory
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: demo-inventory
          image: ghcr.io/web3-frozen/demo-api
          command: ["/inventory"]
          ports:
            - containerPort: 8081
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "8081"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: demo-db-app
                  key: uri
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: redis-password
                  key: password
                  optional: true
            - name: REDIS_URL
              value: "redis://default:$(REDIS_PASSWORD)@redis-master.redis.svc.cluster.local:6379/0"
            - name: PRICING_URL
              value: "http://demo-pricing.demo-app.svc.cluster.local:8082"
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 200m
              memory: 192Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: demo-inventory
  namespace: demo-app
  labels:
    app: demo-inventory
spec:
  selector:
    app: demo-inventory
  ports:
    - port: 8081
      targetPort: http
      name: http
      protocol: TCP
