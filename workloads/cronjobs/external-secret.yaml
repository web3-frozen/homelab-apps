# ExternalSecret — OCI credentials + Telegram from Infisical (project: homelab, env: prod).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: oci-tokyo-vm
  namespace: cronjobs
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: oci-tokyo-vm
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: OCI_TENANCY_OCID
      remoteRef:
        key: INFRA_OCI_TENANCY_OCID
    - secretKey: OCI_USER_OCID
      remoteRef:
        key: INFRA_OCI_USER_OCID
    - secretKey: OCI_FINGERPRINT
      remoteRef:
        key: INFRA_OCI_FINGERPRINT
    - secretKey: oci_private_key
      remoteRef:
        key: INFRA_OCI_PRIVATE_KEY
    - secretKey: OCI_SSH_PUBLIC_KEY
      remoteRef:
        key: INFRA_OCI_SSH_PUBLIC_KEY
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: INFRA_TELEGRAM_BOT_TOKEN
    - secretKey: TELEGRAM_CHAT_ID
      remoteRef:
        key: INFRA_TELEGRAM_BOT_CHAT_ID
