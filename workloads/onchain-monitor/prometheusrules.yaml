# PrometheusRules — infrastructure alerting for onchain-monitor
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: onchain-monitor-alerts
  namespace: onchain-monitor
  labels:
    app.kubernetes.io/part-of: onchain-monitor
spec:
  groups:
    - name: onchain-monitor.rules
      rules:
        # App unreachable for >2 minutes
        - alert: OnchainMonitorDown
          expr: up{job="onchain-monitor-api"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Onchain Monitor API is down"
            description: "The onchain-monitor-api target has been unreachable for more than 2 minutes."

        # HTTP 5xx error rate >5% for 5 minutes
        - alert: OnchainMonitorHighErrorRate
          expr: |
            (
              sum(rate(onchain_monitor_http_requests_total{status_code=~"5.."}[5m]))
              /
              sum(rate(onchain_monitor_http_requests_total[5m]))
            ) > 0.05
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High HTTP error rate on Onchain Monitor"
            description: "HTTP 5xx error rate is above 5% for the last 5 minutes (current: {{ $value | humanizePercentage }})."

        # Any source poll error rate >50% over 5 minutes.
        # Alpha is excluded: it sits behind Cloudflare and a 522 from its
        # origin can last tens of minutes. Paging every 5 minutes is noise;
        # the 2-hour stale alert below is the signal that matters.
        - alert: OnchainMonitorPollFailure
          expr: |
            (
              sum by (source) (rate(onchain_monitor_poll_total{source!="alpha",status="error"}[5m]))
              /
              sum by (source) (rate(onchain_monitor_poll_total{source!="alpha"}[5m]))
            ) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Poll failures for source {{ $labels.source }}"
            description: "Source {{ $labels.source }} has >50% poll failure rate for 5 minutes."

        # No successful poll for 10 continuous minutes. Turtle and alpha are
        # excluded here because Cloudflare intermittently blocks them; they
        # get dedicated 2-hour alerts below.
        - alert: OnchainMonitorPollStale
          # The metric is a Unix timestamp, so compare the age against 600s.
          # Comparing against 0 fired after any 10-minute-old series, even
          # when the last success was only 20-200s ago.
          expr: |
            (time() - onchain_monitor_poll_last_success_timestamp{source!~"turtle|alpha"}) > 600
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Stale data from source {{ $labels.source }}"
            description: "Source {{ $labels.source }} has not polled successfully for 10 continuous minutes (last success {{ $value | humanizeDuration }} ago)."

        # Turtle can be blocked by Cloudflare for long stretches. Only alert
        # after 2 hours without a success, sustained for 15 minutes.
        - alert: OnchainMonitorPollStaleTurtle
          expr: |
            (time() - onchain_monitor_poll_last_success_timestamp{source="turtle"}) > 7200
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Stale data from source turtle"
            description: "Source turtle has not polled successfully for 2 continuous hours (last success {{ $value | humanizeDuration }} ago)."

        # Alpha is also Cloudflare-fronted. Its /api/data endpoint regularly
        # returns 522 while the origin is down (the cached site root still
        # returns 200), so a 10-minute threshold produces pager noise for an
        # external outage we cannot fix. Wait for a sustained 2-hour gap.
        - alert: OnchainMonitorPollStaleAlpha
          expr: |
            (time() - onchain_monitor_poll_last_success_timestamp{source="alpha"}) > 7200
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Stale data from source alpha"
            description: "Source alpha has not polled successfully for 2 continuous hours (last success {{ $value | humanizeDuration }} ago). A Cloudflare 522 on https://alpha123.uk/api/data means the upstream origin is down; the cached site root may still return 200."

        # p95 HTTP latency >2s for 5 minutes
        - alert: OnchainMonitorHighLatency
          expr: |
            histogram_quantile(0.95, sum by (le) (rate(onchain_monitor_http_request_duration_seconds_bucket[5m]))) > 2
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High API latency on Onchain Monitor"
            description: "p95 HTTP request latency is above 2s for the last 5 minutes."

        # PostgreSQL PVC storage usage >80%
        - alert: OnchainMonitorDBStorageHigh
          expr: |
            (
              kubelet_volume_stats_used_bytes{namespace="onchain-monitor", persistentvolumeclaim=~"onchain-monitor-db.*"}
              /
              kubelet_volume_stats_capacity_bytes{namespace="onchain-monitor", persistentvolumeclaim=~"onchain-monitor-db.*"}
            ) > 0.8
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Onchain Monitor DB storage above 80%"
            description: "PVC {{ $labels.persistentvolumeclaim }} is at {{ $value | humanizePercentage }} capacity. Current size: 5Gi. Resize via postgres.yaml storage.size."
