# CloudNativePG PostgreSQL for onchain-monitor
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: onchain-monitor-db
  namespace: onchain-monitor
spec:
  instances: 1
  # Same-major patch on the existing Debian 11 image family.
  # A one-instance cluster restarts its primary during this change.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11-system-bullseye
  storage:
    size: 5Gi
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  monitoring:
    enablePodMonitor: true
  postgresql:
    parameters:
      max_connections: "100"
      shared_buffers: 64MB
  bootstrap:
    initdb:
      database: onchain_monitor
      owner: app
